# Builds the Windows installer on GitHub's Windows machines.
#  - Run it by hand from the Actions tab ("Run workflow"): the installer appears under the run's Artifacts.
#  - Push a tag like v0.1.0: the installer is also attached to a draft GitHub Release you can publish.
name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Tauri CLI
        run: npm install

      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "CDC ${{ github.ref_name }}"
          releaseBody: "Download the -setup.exe file below to install CDC on Windows."
          releaseDraft: true

      - name: Keep the installers with this run
        uses: actions/upload-artifact@v4
        with:
          name: CDC-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
