[package]
name = "cdc"
version = "0.1.0"
description = "CDC: catalogue the CDs on your shelf"
edition = "2021"

[lib]
# The library form lets the same code run in the iPhone and Android apps later.
name = "cdc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset lets the page play files from the audio library (scope set in tauri.conf.json).
tauri = { version = "2", features = ["protocol-asset"] }
# The file picker for adding audio files to a CD.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Downloads cover pictures that the page itself is not allowed to load (see fetch_cover in lib.rs).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
