[package]
name = "cdc"
version = "0.1.0"
description = "CDC: catalogue the CDs on your shelf"
edition = "2021"

[lib]
# The library form lets the same code run in the iPhone and Android apps later.
name = "cdc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
